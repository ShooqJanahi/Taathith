<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourite Furniture</title>

    <link rel="stylesheet" href="../css/PhotoGallery.css">
    <link rel="icon" href="../assets/Taathith.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

    <div id="splash-screen">
        <div class="splash-content">
            <img src="../assets/Taathith.png" alt="Taathith Logo" class="splash-logo">
            <h1>Taathith</h1>
            <p>Your saved furniture</p>
            <div class="loader"></div>
        </div>
    </div>

    <header class="header">
    <div class="logo">
        <img src="../assets/Taathith.png" alt="Taathith Logo">
        <span>Taathith</span>
    </div>

    <div class="header-search">
        <input type="text" id="fav-search" placeholder="Search favourite furniture...">
    </div>

    <nav>
        <a href="UserDashboard.html">
            <i class="fa-solid fa-arrow-left"></i> Back to Shopping
        </a>
        <a href="Cart.html">
            <i class="fa-solid fa-cart-shopping"></i> Cart
        </a>
    </nav>
</header>

    <main class="page">
        <section class="page-title">
            <h1>Favourite Furniture</h1>
            <p>Furniture saved for later will appear here.</p>
        </section>

        <section class="gallery" id="favourites-container"></section>
    </main>

    <script src="../js/PhotoGallery.js"></script>
</body>
</html>
