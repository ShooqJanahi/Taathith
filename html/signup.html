<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="stylesheet" href="../css/signup.css">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/solid.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="icon" href="../assets/Taathith.png" type="image/png">
</head>

<body>

    <div id="splash-screen">
        <div class="splash-content">
            <img src="../assets/Taathith.png" alt="Taathith Logo" class="splash-logo">
            <h1>Taathith</h1>
            <p>Furniture for homes & offices</p>
            <div class="loader"></div>
        </div>
    </div>

    <div class="container">

        <div class="sidebar">
            <div class="logo">
                <img src="../assets/Taathith.png" alt="Taathith Logo">
            </div>

            <h2>Join Taathith</h2>

            <ul>
                <li><i class="uis uis-check-circle"></i> Browse furniture for homes and offices</li>
                <li><i class="uis uis-check-circle"></i> Save favourite furniture for later</li>
                <li><i class="uis uis-check-circle"></i> Add items to your cart easily</li>
                <li><i class="uis uis-check-circle"></i> View your order history</li>
            </ul>
        </div>

        <div class="main-content">

            <div class="top-bar">
                <span>Already have an account?</span>
                <a href="./login.html" class="login-link">Login</a>
            </div>

            <form class="signup-form">
                <h2>Create Account</h2>

                <div class="input-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" placeholder="First Name" required>
                </div>

                <div class="input-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" placeholder="Last Name">
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="repeat-password">Repeat Password</label>
                    <div class="password-container">
                        <input type="password" id="repeat-password" name="repeat-password" placeholder="Repeat password" required>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="input-group terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="./Terms.html">Terms and Privacy Policy</a></label>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>
            </form>

        </div>
    </div>

    <script type="module" src="../js/Signup.js"></script>
</body>

</html>
