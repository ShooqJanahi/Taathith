<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Details</title>

    <link rel="stylesheet" href="../css/ViewImage.css">
    <link rel="icon" href="../assets/Taathith.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

    <div id="splash-screen">
        <div class="splash-content">
            <img src="../assets/Taathith.png" alt="Taathith Logo" class="splash-logo">
            <h1>Taathith</h1>
            <p>Furniture for homes & offices</p>
            <div class="loader"></div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <img src="../assets/Taathith.png" alt="Taathith Logo">
            <span>Taathith</span>
        </div>

        <div class="profile-section">
            <a href="Cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            <a href="UserDashboard.html">Home</a>
        </div>
    </div>

    <div class="container">
        <div class="image-section">
            <img id="furniture-image" src="../assets/Taathith.png" alt="Furniture Image">
        </div>

        <div class="details-section">
            <span class="tag">Furniture Details</span>
            <h1 id="furniture-title">Furniture Title</h1>
            <p id="furniture-description">Furniture description will appear here.</p>

            <div class="detail-box">
                <p><strong>Made by:</strong> <span id="furniture-made-by"></span></p>
                <p><strong>Measurement:</strong> <span id="furniture-measurement"></span></p>
                <p><strong>Price:</strong> <span id="furniture-price"></span></p>
            </div>

            <div class="buttons">
                <button id="buy-button"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
                <button id="try-button"><i class="fa-solid fa-camera"></i> Try</button>
                <button id="save-button"><i class="fa-regular fa-heart"></i> Save</button>
            </div>
        </div>
    </div>

    <script>
        const splashScreen = document.getElementById("splash-screen");

        window.addEventListener("load", () => {
            setTimeout(() => {
                splashScreen.classList.add("hidden");

                setTimeout(() => {
                    splashScreen.style.display = "none";
                }, 600);
            }, 1200);
        });

        const item = JSON.parse(localStorage.getItem("selectedFurniture"));

        if (!item) {
            alert("No furniture selected.");
            window.location.href = "UserDashboard.html";
        } else {
            document.getElementById("furniture-image").src = item.image;
            document.getElementById("furniture-title").textContent = item.title;
            document.getElementById("furniture-description").textContent = item.description;
            document.getElementById("furniture-made-by").textContent = item.madeBy;
            document.getElementById("furniture-measurement").textContent = item.measurement;
            document.getElementById("furniture-price").textContent = item.price;
        }

        document.getElementById("buy-button").addEventListener("click", () => {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.push(item);
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Added to cart.");
        });

        document.getElementById("save-button").addEventListener("click", () => {
            let favourites = JSON.parse(localStorage.getItem("favourites")) || [];
            favourites.push(item);
            localStorage.setItem("favourites", JSON.stringify(favourites));
            alert("Saved to favourites.");
        });

        document.getElementById("try-button").addEventListener("click", () => {
            alert("Camera try feature will be added later.");
        });
    </script>

</body>
</html>
