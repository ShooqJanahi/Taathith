<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>

    <link rel="stylesheet" href="../css/Settings.css">
    <link rel="icon" href="../assets/Taathith.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

<div id="splash-screen">
    <div class="splash-content">
        <img src="../assets/Taathith.png" alt="Taathith Logo" class="splash-logo">
        <h1>Taathith</h1>
        <p>Account settings</p>
        <div class="loader"></div>
    </div>
</div>

<header class="header">
    <div class="logo">
        <img src="../assets/Taathith.png" alt="Taathith Logo">
        <span>Taathith</span>
    </div>

    <nav>
        <a href="UserDashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Shopping</a>
        <a href="PhotoGallery.html"><i class="fa-solid fa-heart"></i> Favourites</a>
        <a href="Cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
    </nav>
</header>

<main class="settings-page">

    <aside class="side-card">
        <div class="avatar" id="user-avatar">U</div>
        <h2 id="welcome-name">Welcome, User</h2>
        <p>Manage your Taathith account</p>

        <div class="side-links">
            <a href="UserDashboard.html"><i class="fa-solid fa-store"></i> Shop</a>
            <a href="PhotoGallery.html"><i class="fa-solid fa-heart"></i> Favourites</a>
            <a href="Cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
            <a href="#" id="logout-button"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>

    <section class="settings-content">

        <div class="card">
            <h1>Settings</h1>
            <p class="subtitle">Update your basic account information.</p>

            <form id="settings-form">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">

                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">

                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="Enter phone number">

                <label>Address</label>
                <input type="text" id="address" placeholder="Enter delivery address">

                <button type="submit">Save Changes</button>
            </form>
        </div>

        <div class="card">
            <h2>Shopping Preferences</h2>

            <label>Preferred Room Type</label>
            <select id="room-type">
                <option value="">Select room type</option>
                <option value="Living Room">Living Room</option>
                <option value="Bedroom">Bedroom</option>
                <option value="Office">Office</option>
                <option value="Dining Room">Dining Room</option>
            </select>

            <label>Preferred Furniture Style</label>
            <select id="style-type">
                <option value="">Select style</option>
                <option value="Modern">Modern</option>
                <option value="Classic">Classic</option>
                <option value="Minimal">Minimal</option>
                <option value="Luxury">Luxury</option>
            </select>

            <button id="save-preferences">Save Preferences</button>
        </div>

        <div class="card danger-zone">
            <h2>Danger Zone</h2>
            <p>This will clear your local account data, cart, and favourites.</p>
            <button id="clear-data">Clear My Data</button>
        </div>

    </section>

</main>

<script src="../js/Settings.js"></script>
</body>
</html>
